server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Block scanner probes — return 404 (not 200) for sensitive paths
    location ~* /\.(env|git|svn|hg|htaccess|htpasswd) {
        return 404;
    }
    location ~* /(\.env|wp-config\.php|wp-config\.php~|wp-config\.php\.bak|wp-config\.php\.swp|wp-config\.php\.save|wp-config\.php\.old) {
        return 404;
    }
    location ~* /actuator/ {
        return 404;
    }
    location ~* /_ignition/ {
        return 404;
    }
    # Block common scan paths
    location ~* /(phpinfo|phpmyadmin|pma|adminer|xmlrpc\.php|wp-login\.php|wp-admin/) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}